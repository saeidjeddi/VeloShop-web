services:

  # ============================================================
  # DJANGO
  # ============================================================

  app:
    build:
      context: ./app

    container_name: app
    restart: always

    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000

    expose:
      - "8000"

    volumes:
      - ./app:/app
      - ./volumes/media:/volumes/media
      - ./volumes/assets:/volumes/assets

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      pgbouncer:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy


  # ============================================================
  # NGINX
  # ============================================================

  nginx:
    build:
      context: ./nginx

    container_name: nginx
    restart: always

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      app:
        condition: service_started

    volumes:
      - ./volumes/media:/volumes/media:ro
      - ./volumes/assets:/volumes/assets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot:/var/www/certbot:ro
      - ./nginx/certbot:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot:/var/www/certbot

  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:8.2

    container_name: redis
    restart: always

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}


    volumes:
      - ./volumes/redisdata:/data
#
#    expose:
#      - "6379"
    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test:
        [ "CMD","redis-cli","-a","${REDIS_PASSWORD}","ping" ]


      interval: 5s
      timeout: 5s
      retries: 10


  # ============================================================
  # POSTGRESQL PRIMARY
  # ============================================================


  postgres:
    image: postgres:18
    container_name: postgres
    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - type: bind
        source: ./volumes/dbdata
        target: /var/lib/postgresql


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ============================================================
  # PGBOUNCER
  # ============================================================

  pgbouncer:
    image: edoburu/pgbouncer:latest

    container_name: pgbouncer
    restart: always

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      AUTH_TYPE: scram-sha-256

      POOL_MODE: transaction

      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 5

    expose:
      - "5432"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        ["CMD-SHELL","pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ============================================================
  # RABBITMQ
  # ============================================================

  rabbitmq:
    image: rabbitmq:4.2.9-management

    container_name: rabbitmq
    restart: always

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    volumes:
      - ./volumes/rabbitmqdata:/var/lib/rabbitmq

    ports:
#      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    healthcheck:
      test:
        ["CMD","rabbitmq-diagnostics","-q","ping"]
      interval: 5s
      timeout: 5s
      retries: 10


 # ============================================================
  # CELERY WORKER
  # ============================================================

  celery-worker:
    build:
      context: ./app

    container_name: celery-worker
    restart: always

    command:
      - celery
      - -A
      - config
      - worker


    environment:
      SKIP_COLLECTSTATIC: "true"

    volumes:
      - ./app:/app
      - ./volumes/media:/volumes/media
      - ./volumes/assets:/volumes/assets

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      pgbouncer:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy


  # ============================================================
  # CELERY BEAT
  # ============================================================
  celery-beat:
    build:
      context: ./app

    container_name: celery-beat
    restart: always

    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO

    environment:
      SKIP_COLLECTSTATIC: "true"

    volumes:
      - ./app:/app
      - ./volumes/celerybeat:/var/run/celery

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy