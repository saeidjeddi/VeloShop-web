include /etc/nginx/conf.d/upstream.inc;

server {
    listen 80;
    server_name webdat.ir www.webdat.ir;

    client_max_body_size 500M;


    include /etc/nginx/conf.d/locations.inc;
    include /etc/nginx/conf.d/errors.inc;
}



server {
    listen 443 ssl;
    server_name webdat.ir;

    ssl_certificate /etc/letsencrypt/live/webdat.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webdat.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500M;

    include /etc/nginx/conf.d/locations.inc;
    include /etc/nginx/conf.d/errors.inc;
}